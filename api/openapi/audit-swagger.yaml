openapi: 3.0.3
info:
  title: Audit Service API
  description: >
    Read APIs for domain-event audit. Writes arrive from the message bus.
    A root event has a non-empty correlation_id and an empty causation_id.
  version: 1.1.0

servers:
  - url: http://localhost:18806/api
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BaseResponse:
      type: object
      description: Envelope returned by server.Success / Error*
      properties:
        code:
          type: integer
          description: Business code from common/server.Code (0 = success)
          example: 0
        message:
          type: string
          example: Successfully
        timestamp:
          type: string
          format: date-time
      required:
        - code
        - message
        - timestamp

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true

    AuditEvent:
      type: object
      properties:
        id:
          type: string
        event_id:
          type: string
          example: evt-1
        event_name:
          type: string
          example: UserCreated
        operator_id:
          type: integer
          format: uint64
        category:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
      required:
        - event_id
        - event_name
        - timestamp
        - metadata

    AuditMetadata:
      type: object
      properties:
        service:
          type: string
          example: user
        aggregate_id:
          type: string
        correlation_id:
          type: string
        causation_id:
          type: string
        payload:
          type: object
          additionalProperties: true
      required:
        - service

    PageInfo:
      type: object
      properties:
        start_cursor:
          type: string
        end_cursor:
          type: string
        has_previous_page:
          type: boolean
        has_next_page:
          type: boolean
      required:
        - has_previous_page
        - has_next_page

    AuditEventEdge:
      type: object
      properties:
        cursor:
          type: string
        node:
          $ref: '#/components/schemas/AuditEvent'
      required:
        - cursor
        - node

    AuditEventConnection:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
          description: Omitted as 0 for Mongo cursor pages (no full collection count)
        edges:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventEdge'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
        - edges
        - page_info

    AuditEventNode:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/AuditEvent'
        children:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventNode'
      required:
        - event

    AuditEventGraph:
      type: object
      description: Forest of events sharing the requested event's correlation_id
      properties:
        event_id:
          type: string
        roots:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventNode'
      required:
        - event_id
        - roots

    AuditEventPageResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuditEventConnection'

    AuditEventGraphResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuditEventGraph'

paths:
  /events/page:
    get:
      summary: Page root audit events
      description: >
        Cursor-based page of root events (correlation_id != "" and causation_id == "").
        Default page size is 20. Newest timestamp first. first/after page forward;
        last/before page backward. Do not mix first with last.
      operationId: pageRootEvents
      tags:
        - Audit
      security:
        - BearerAuth: []
      parameters:
        - name: first
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          schema:
            type: string
        - name: last
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before
          in: query
          schema:
            type: string
        - name: service
          in: query
          schema:
            type: string
        - name: event_name
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
            description: Exclusive upper bound on timestamp when from is also set
      responses:
        '200':
          description: Root event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPageResponse'
        '400':
          description: Invalid pagination or window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events/{event_id}:
    get:
      summary: Get event flow graph
      description: >
        Returns the requested event's correlation forest. Sibling roots (same
        correlation_id, empty causation_id) appear as multiple roots. Children
        attach by causation_id = parent event_id.
      operationId: getEventGraph
      tags:
        - Audit
      security:
        - BearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventGraphResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
