#info:
#  title: Schnorr ZKP Auth API
#  description: |
#    基于 Schnorr 零知识证明的无密码认证服务。
#
#    ## 核心思想
#    - 服务端**永不接触密码**，只存储公钥。
#    - 登录分两阶段：`/challenge` 换取一次性 `nonce` + `salt`，`/login` 提交零知识证明 `(R, s)`。
#    - 私钥 `x` 由密码 `KDF(pwd, salt)` 在**客户端本地**派生，全程不上网。
#
#    ## 编码约定
#    - 所有大整数 / 字节串统一使用 **base64** 编码。
#    - `salt` 与 `nonce` 为公开参数，可明文传输。
#    - 生产环境必须启用 HTTPS（防 nonce 篡改与 JS 注入）。
