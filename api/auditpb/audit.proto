syntax = "proto3";

option go_package = "github.com/Crows-Storm/Axis/common/genproto/auditpb";

service AuditService {
  rpc PageRootEvents(PageRootEventsRequest) returns (AuditEventConnection);
  rpc GetEventGraph(GetEventGraphRequest) returns (AuditEventGraph);
}

message PageRootEventsRequest {
  optional int32 first = 1;
  optional string after = 2;
  optional int32 last = 3;
  optional string before = 4;
  string service = 5;
  string event_name = 6;
  string from = 7;
  string to = 8;
}

message AuditEventConnection {
  int64 total_count = 1;
  repeated AuditEventEdge edges = 2;
  PageInfo page_info = 3;
}

message AuditEventEdge {
  string cursor = 1;
  AuditEvent node = 2;
}

message PageInfo {
  string start_cursor = 1;
  string end_cursor = 2;
  bool has_previous_page = 3;
  bool has_next_page = 4;
}

message GetEventGraphRequest {
  string event_id = 1;
}

message AuditEventGraph {
  string event_id = 1;
  repeated AuditEventNode roots = 2;
}

message AuditEventNode {
  AuditEvent event = 1;
  repeated AuditEventNode children = 2;
}

message AuditEvent {
  string id = 1;
  string event_id = 2;
  string event_name = 3;
  uint64 operator_id = 4;
  string category = 5;
  string timestamp = 6;
  Metadata metadata = 7;
}

message Metadata {
  string service = 1;
  string aggregate_id = 2;
  string correlation_id = 3;
  string causation_id = 4;
  bytes payload = 5;
}
