openapi: 3.0.3
info:
  title: User Service API
  description: All web APIs for User service
  version: 1.0.0

servers:
  - url: http://localhost:18081/api/v1
    description: Local development server

# =============================================================================
# Security Schemes
# Defines the authentication methods available for this API.
# The Bearer token scheme is used for JWT-based authentication.
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Enter your JWT token in the format: Bearer <token>.
        Example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  # ===========================================================================
  # Reusable Schemas
  # These schemas define the data models used in requests and responses.
  # They are referenced via $ref to keep the spec DRY (Don't Repeat Yourself).
  # ===========================================================================
  schemas:
    # ---------------------------------------------------------------------------
    # Base Response (without data field)
    # Used as the foundation for all successful responses via allOf composition.
    # ---------------------------------------------------------------------------
    BaseResponse:
      type: object
      description: Standard API response base (without data)
      properties:
        code:
          type: integer
          description: >
            Business status code.
            0 indicates success; non-zero values indicate specific errors.
          enum: [0, 400, 401, 403, 404, 500]
          example: 0
        message:
          type: string
          description: Human-readable status message
          example: "success"
      required:
        - code
        - message

    # ---------------------------------------------------------------------------
    # Error Response (for non-200 status codes)
    # This is a specialized response that doesn't use the data field.
    # ---------------------------------------------------------------------------
    ErrorResponse:
      type: object
      description: Standard API error response
      properties:
        code:
          type: integer
          description: >
            Business status code.
            Non-zero values indicate specific errors.
          enum: [400, 401, 403, 404, 500]
          example: 40101
        message:
          type: string
          description: Human-readable error message
          example: "Authentication token is missing or invalid"
        # data field is optional and usually null in error responses
        data:
          nullable: true
          description: Additional error details (usually null)
      required:
        - code
        - message

    # ---------------------------------------------------------------------------
    # User Information Object
    # Represents the core profile data of a user.
    # ---------------------------------------------------------------------------
    UserInfo:
      type: object
      description: Core profile information of the user
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the user
          example: 113453443
        loginId:
          type: string
          description: Login username of the user
          example: "johndoe"
        email:
          type: string
          format: email
          description: Email address of the user
          example: "johndoe@example.com"
        status:
          type: integer
          description: >
            Account status code.
            0 = disabled, 1 = active
          enum: [0, 1]
          example: 1
        create_time:
          type: string
          format: date-time
          description: Timestamp when the user account was created
          example: "2024-01-15T08:30:00Z"
        update_time:
          type: string
          format: date-time
          description: Timestamp when the user account was updated
          example: "2024-01-15T08:30:00Z"
      required:
        - id
        - loginId
        - status
    UpdateUserInfoRequest:
      type: object
      description: Core profile information of the user
      properties:
        loginId:
          type: string
          description: Login username of the user
          example: "johndoe"
        password:
          type: string
          format: password
          description: password of the user
          example: "123456"
        email:
          type: string
          format: email
          description: Email address of the user
          example: "johndoe@example.com"
      required:
        - loginId
        - password
        - email

    # ---------------------------------------------------------------------------
    # UserInfo Response (with data field typed as UserInfo)
    # Uses allOf to combine BaseResponse and a custom data field.
    # ---------------------------------------------------------------------------
    UserInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserInfo'
          required:
            - data
    UpdateUserInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
          required:
            - data

# =============================================================================
# API Paths
# Each path defines the available HTTP methods and their behavior.
# =============================================================================
paths:
  /:
    get:
      summary: Get current user info
      description: >
        Retrieves the profile information of the currently authenticated user.
        The user identity is determined from the JWT token provided in the
        Authorization header. This endpoint does not accept any path or query
        parameters.
      operationId: getCurrentUserInfo
      tags:
        - User
      # Require Bearer token authentication for this endpoint
      security:
        - BearerAuth: []
      responses:
        # ----- 200 OK: User info retrieved successfully -----
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              example:
                code: 0
                message: "success"
                data:
                  id: 113453443
                  loginId: "johndoe"
                  email: "johndoe@example.com"
                  status: 1
                  create_time: "2024-01-15T08:30:00Z"
                  update_time: "2024-01-15T08:30:00Z"

        # ----- 401 Unauthorized: Missing or invalid token -----
        '401':
          description: >
            Unauthorized. The request lacks valid authentication credentials.
            This occurs when the Authorization header is missing, the JWT
            token is expired, or the token signature is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"

        # ----- 500 Internal Server Error: Unexpected server failure -----
        '500':
          description: >
            Internal server error. An unexpected condition was encountered
            while processing the request. The client should retry after
            a short delay or contact support if the issue persists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"
    put:
      summary: Update current user info
      description: >
        Modify the current user's information
      operationId: UpdateCurrentUserInfo
      tags:
        - User
      # Require Bearer token authentication for this endpoint
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInfoRequest'
      responses:
        '200':
          description: Modify the current user's information successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserInfoResponse'

  /{id}:
    get:
      summary: Get current user info
      description: >
        Retrieves the profile information of the currently authenticated user.
        The user identity is determined from the JWT token provided in the
        Authorization header. This endpoint does not accept any path or query
        parameters.
      operationId: getUserInfoById
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 113453443
      # Require Bearer token authentication for this endpoint
      security:
        - BearerAuth: [ ]
      responses:
        # ----- 200 OK: User info retrieved successfully -----
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              example:
                code: 0
                message: "success"
                data:
                  id: 113453443
                  loginId: "johndoe"
                  email: "johndoe@example.com"
                  status: 1
                  create_time: "2024-01-15T08:30:00Z"
                  update_time: "2024-01-15T08:30:00Z"

        # ----- 401 Unauthorized: Missing or invalid token -----
        '401':
          description: >
            Unauthorized. The request lacks valid authentication credentials.
            This occurs when the Authorization header is missing, the JWT
            token is expired, or the token signature is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"

        # ----- 500 Internal Server Error: Unexpected server failure -----
        '500':
          description: >
            Internal server error. An unexpected condition was encountered
            while processing the request. The client should retry after
            a short delay or contact support if the issue persists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"