# 项目标识
sonar.projectKey=Axis
sonar.projectName=Axis
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# 源码目录（按你的实际结构填写）
sonar.sources=.
# 排除不需要扫描的目录，比如 vendor、构建产物
sonar.exclusions=**/vendor/**,**/bin/**,**/*_test.go

# 测试文件配置
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**

# 指定 golangci-lint 输出的报告路径
sonar.go.golangci-lint.reportPaths=reports/go-ci-lint.checkstyle.xml

# 测试覆盖率报告路径（可选）
# sonar.go.coverage.reportPaths=reports/coverage.out