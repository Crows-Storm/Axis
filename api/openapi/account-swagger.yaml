openapi: 3.0.3
info:
  title: Account Service API
  description: User accounts (spot/futures/...) each holding a map of currency wallets.
  version: 1.0.0

servers:
  - url: http://localhost:18803/api
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BaseResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: Successfully
        timestamp:
          type: string
          format: date-time
      required:
        - code
        - message
        - timestamp

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true

    AccountType:
      type: string
      enum: [spot, futures, savings, card, escrow]
      example: spot

    AssetClass:
      type: string
      enum: [crypto, fiat, stock, commodity]
      example: fiat

    Currency:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        class:
          $ref: '#/components/schemas/AssetClass'
        symbol:
          type: string
          example: USDT
        name:
          type: string
          example: Tether USD
        address:
          type: string
        decimals:
          type: integer
          minimum: 0
          maximum: 18
          example: 6
        smallest_unit:
          type: string
          example: micro
      required:
        - id
        - class
        - symbol
        - name
        - decimals
        - smallest_unit

    WalletInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        account_id:
          type: integer
          format: uint64
        currency:
          $ref: '#/components/schemas/Currency'
        balance:
          type: string
          description: Integer amount in smallest_unit (no floating point)
          example: "1500500000"
        address:
          type: string
      required:
        - id
        - account_id
        - currency
        - balance

    AccountInfo:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        user_id:
          type: integer
          format: uint64
        type:
          $ref: '#/components/schemas/AccountType'
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/WalletInfo'
      required:
        - id
        - user_id
        - type
        - wallets

    OpenAccountRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        user_id:
          type: integer
          format: uint64
          description: Console only; app always opens for the token subject
      required:
        - type

    OpenWalletRequest:
      type: object
      properties:
        currency_id:
          type: integer
          format: uint64
        symbol:
          type: string
          example: USDT

    AccountResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AccountInfo'

    AccountListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AccountInfo'

    WalletResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WalletInfo'

    CurrencyListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Currency'

    MutationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string

paths:
  /:
    get:
      summary: List current user accounts
      operationId: getMyAccounts
      tags: [Account]
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AccountType'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Open an account
      operationId: openAccount
      tags: [Account]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '200':
          description: Opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /currencies:
    get:
      summary: List currency catalog
      operationId: listCurrencies
      tags: [Account]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyListResponse'

  /user/{id}:
    get:
      summary: List accounts by user ID
      operationId: getAccountsByUserId
      tags: [Account]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/AccountType'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wallet/{id}:
    get:
      summary: Get wallet by ID
      operationId: getWalletById
      tags: [Account]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{id}:
    get:
      summary: Get account by ID
      operationId: getAccountById
      tags: [Account]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{id}/wallets:
    post:
      summary: Open a currency wallet on an account
      operationId: openWallet
      tags: [Account]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWalletRequest'
      responses:
        '200':
          description: Opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
