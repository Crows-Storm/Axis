openapi: 3.0.3
info:
  title: User Service API
  description: All Axis-web APIs for User service
  version: 1.0.0

servers:
  - url: http://localhost:18801/api
    description: Local development server

# =============================================================================
# Security Schemes
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Enter your JWT token in the format: Bearer <token>.
        Example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  # ===========================================================================
  # Reusable Schemas
  # ===========================================================================
  schemas:
    # ---------------------------------------------------------------------------
    # Base Response (without data field)
    # ---------------------------------------------------------------------------
    BaseResponse:
      type: object
      description: Envelope returned by server.Success / Error* (HTTP status is often 200)
      properties:
        code:
          type: integer
          description: Business code from common/server.Code (0 = success)
          example: 0
        message:
          type: string
          example: "Successfully"
        timestamp:
          type: string
          format: date-time
      required:
        - code
        - message
        - timestamp

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true

    UserInfo:
      type: object
      description: user/domain/user.User JSON (password omitted)
      properties:
        id:
          type: integer
          format: uint64
          example: 113453443
        username:
          type: string
          example: "johndoe"
        login_id:
          type: string
          example: "johndoe"
        email:
          type: string
          example: "johndoe@example.com"
        status:
          type: integer
          description: common/domain/user.Status — Activated=0, Disabled=1
          enum: [0, 1]
          example: 0
        deleted:
          type: integer
          description: 0 undeleted, 1 deleted
          enum: [0, 1]
          example: 0
      required:
        - id
        - login_id
        - status

    UpdateUserInfoRequest:
      type: object
      description: Bound as domain.User; handler only applies non-empty email
      properties:
        email:
          type: string
          example: "johndoe@example.com"

    CreateUserRequest:
      type: object
      description: command.CreateUserCommand
      properties:
        login_id:
          type: string
          example: "newuser"
        username:
          type: string
          example: "newuser"
        password:
          type: string
          format: password
          example: "password123"
        email:
          type: string
          example: "newuser@example.com"
      required:
        - login_id
        - username
        - password
        - email

    CreateBatchUserRequest:
      type: object
      description: command.CreateBatchUserCommand
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              login_id:
                type: string
              password:
                type: string
                format: password
              email:
                type: string
            required:
              - login_id
              - password
              - email
      required:
        - items

    EmptyCommandResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          description: command handlers return struct{}; data is {}
          properties:
            data:
              type: object
              additionalProperties: true

    UserInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserInfo'

    PageInfo:
      type: object
      properties:
        start_cursor:
          type: string
        end_cursor:
          type: string
        has_previous_page:
          type: boolean
        has_next_page:
          type: boolean
      required:
        - has_previous_page
        - has_next_page

    UserEdge:
      type: object
      properties:
        cursor:
          type: string
        node:
          $ref: '#/components/schemas/UserInfo'
      required:
        - cursor
        - node

    UserConnection:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
        edges:
          type: array
          items:
            $ref: '#/components/schemas/UserEdge'
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
        - edges
        - page_info

    UserPageResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserConnection'

    UpdateUserInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: boolean
              example: true

    UserStatsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                totalUsers:
                  type: integer
                  format: int64
                activeUsers:
                  type: integer
                  format: int64
                disableUsers:
                  type: integer
                  format: int64
                deletedUsers:
                  type: integer
                  format: int64
              required:
                - totalUsers
                - activeUsers
                - disableUsers
                - deletedUsers

    ExistsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: boolean

    DeleteResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: boolean
              example: true

    UpdateStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true

    CreateBatchResponse:
      allOf:
        - $ref: '#/components/schemas/EmptyCommandResponse'

# =============================================================================
# API Paths
# =============================================================================
paths:

  # ===========================================================================
  # / - Root resource
  # ===========================================================================
  /:
    # -------------------------------------------------------------------------
    # GetInfo - Get current user info
    # -------------------------------------------------------------------------
    get:
      summary: Get current user info
      description: >
        Retrieves the profile information of the currently authenticated user.
        The user identity is determined from the JWT token provided in the
        Authorization header. This endpoint does not accept any path or query
        parameters.
      operationId: getCurrentUserInfo
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              example:
                code: 0
                message: "success"
                data:
                  id: 113453443
                  username: "johndoe"
                  login_id: "johndoe"
                  email: "johndoe@example.com"
                  status: 0
                  deleted: 0
        '401':
          description: >
            Unauthorized. The request lacks valid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

    # -------------------------------------------------------------------------
    # Update - Update current user info
    # -------------------------------------------------------------------------
    put:
      summary: Update current user info
      description: Modify the current user's information
      operationId: UpdateCurrentUserInfo
      tags:
        - User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInfoRequest'
      responses:
        '200':
          description: Modify the current user's information successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserInfoResponse'
              example:
                code: 0
                message: "success"
                data: "User info updated successfully"
        '400':
          description: Bad request. Invalid input data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: "Invalid input data"
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

    # -------------------------------------------------------------------------
    # Create - Create a new user
    # -------------------------------------------------------------------------
    post:
      summary: Create a new user
      description: Create a new user account with the provided information.
      operationId: createUser
      tags:
        - User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyCommandResponse'
              example:
                code: 0
                message: "Successfully"
                data: {}
        '400':
          description: Bad request. Invalid input data or user already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: "loginId already exists"
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

  /page:
    get:
      summary: Page users
      description: >
        Cursor page of users that are not soft-deleted. Default size 20, newest id first.
        first/after page forward; last/before page backward.
      operationId: pageUsers
      tags:
        - User
      security:
        - BearerAuth: []
      parameters:
        - name: first
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          schema:
            type: string
        - name: last
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before
          in: query
          schema:
            type: string
        - name: login_id
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
            description: Activated=0, Disabled=1
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '400':
          description: Invalid pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ===========================================================================
  # /{id} - User resource by ID
  # ===========================================================================
  /{id}:
    # -------------------------------------------------------------------------
    # GetInfo - Get user info by ID
    # -------------------------------------------------------------------------
    get:
      summary: Get user info by ID
      description: >
        Retrieves the profile information of a specific user identified by
        their unique ID.
      operationId: getUserInfoById
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: uint64
            minimum: 1
            example: 113453443
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              example:
                code: 0
                message: "success"
                data:
                  id: 113453443
                  username: "johndoe"
                  login_id: "johndoe"
                  email: "johndoe@example.com"
                  status: 0
                  deleted: 0
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 404
                message: "User not found"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

    # -------------------------------------------------------------------------
    # SoftDelete - Soft delete a user by ID
    # -------------------------------------------------------------------------
    delete:
      summary: Soft delete a user
      description: >
        Soft delete a user by setting their status to deleted.
        The user record is retained in the database but marked as deleted.
      operationId: softDeleteUser
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user to delete
          schema:
            type: integer
            format: uint64
            minimum: 1
            example: 113453443
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User soft deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              example:
                code: 0
                message: "success"
                data: "User deleted successfully"
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 404
                message: "User not found"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

  # ===========================================================================
  # /batch - Batch operations
  # ===========================================================================
  /batch:
    # -------------------------------------------------------------------------
    # CreateBatch - Batch create users
    # -------------------------------------------------------------------------
    post:
      summary: Batch create users
      description: >
        Create multiple user accounts in a single request.
        Returns the count of successful and failed creations along
        with error details for each failed item.
      operationId: createBatchUsers
      tags:
        - User
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchUserRequest'
      responses:
        '200':
          description: Batch creation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBatchResponse'
              example:
                code: 0
                message: "success"
                data:
                  successCount: 4
                  failCount: 1
                  errors:
                    - index: 2
                      message: "loginId already exists"
        '400':
          description: Bad request. Invalid input data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: "Users list cannot be empty"
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

  # ===========================================================================
  # /exists - Check user existence
  # ===========================================================================
  /exists:
    # -------------------------------------------------------------------------
    # ExistsWithTransaction - Check if a user exists
    # -------------------------------------------------------------------------
    get:
      summary: Check if a user exists
      description: >
        Check whether a user exists. Exactly one of id, login_id, email must be set.
      operationId: existsWithTransaction
      tags:
        - User
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
            format: uint64
        - name: login_id
          in: query
          required: false
          schema:
            type: string
            example: "johndoe"
        - name: email
          in: query
          required: false
          schema:
            type: string
            example: "johndoe@example.com"
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Existence check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistsResponse'
              example:
                code: 0
                message: "success"
                data: true
        '400':
          description: Bad request. Exactly one of id, login_id, email is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: "At least one of loginId or email is required"
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

  # ===========================================================================
  # /stats - User statistics
  # ===========================================================================
  /stats:
    # -------------------------------------------------------------------------
    # GetStats - Get user statistics
    # -------------------------------------------------------------------------
    get:
      summary: Get user statistics
      description: >
        Retrieves aggregate statistics about users, including total count,
        active count, and disabled count.
      operationId: userStatusAnalysis
      tags:
        - User
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
              example:
                code: 0
                message: "success"
                data:
                  totalUsers: 1500
                  activeUsers: 1200
                  disableUsers: 300
                  deletedUsers: 50
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

  # ===========================================================================
  # /{id}/disable - Disable User by id
  # ===========================================================================
  /{id}/disable:
    # -------------------------------------------------------------------------
    # UpdateStatus - Update user status
    # -------------------------------------------------------------------------
    put:
      summary: Disable User by id
      description: >
        Disable User by id
      operationId: disable
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: integer
            format: uint64
            minimum: 1
            example: 113453443
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatusResponse'
              example:
                code: 0
                message: "success"
                data: {}
        '400':
          description: Bad request. Invalid status value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                message: "Invalid status value"
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 404
                message: "User not found"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

  /{id}/enable:
    put:
      summary: Enable user by id
      description: Activate a disabled user.
      operationId: enable
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
            minimum: 1
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatusResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'