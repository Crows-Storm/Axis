openapi: 3.0.3
info:
  title: Chain Service API
  description: >
    Blockchain integration and listeners. RPC, subscriptions, confirmations,
    and chain event ingest. Do not put private keys or mnemonic in this service's
    source; venue trading stays in exchange; display prices stay in market.
  version: 0.1.0

servers:
  - url: http://localhost:18809/api
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BaseResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: Successfully
        timestamp:
          type: string
          format: date-time
      required:
        - code
        - message
        - timestamp

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true

    ServiceStatus:
      type: object
      properties:
        service:
          type: string
          example: chain
        role:
          type: string
          example: blockchain-integration
      required:
        - service
        - role

    ServiceStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ServiceStatus'

paths:
  /status:
    get:
      summary: Service identity
      operationId: getStatus
      tags:
        - Chain
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Service role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
