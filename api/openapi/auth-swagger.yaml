openapi: 3.0.3
info:
  title: Auth Service API
  description: All Axis-web APIs for Auth service
  version: 1.0.0

servers:
  - url: http://localhost:18802/api
    description: Local development server

# =============================================================================
# Security Schemes
# Defines the authentication methods available for this API.
# The Bearer token scheme is used for JWT-based authentication.
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Enter your JWT token in the format: Bearer <token>.
        Example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  # ===========================================================================
  # Reusable Schemas
  # These schemas define the data models used in requests and responses.
  # They are referenced via $ref to keep the spec DRY (Don't Repeat Yourself).
  # ===========================================================================
  schemas:
    # ---------------------------------------------------------------------------
    # Base Response (without data field)
    # Used as the foundation for all successful responses via allOf composition.
    # ---------------------------------------------------------------------------
    BaseResponse:
      type: object
      description: Envelope returned by server.Success / Error* (HTTP status is often 200)
      properties:
        code:
          type: integer
          description: >
            Business code from common/server.Code.
            0 = success; 1000+ client; 2000+ auth; 3000+ not found; 5000+ server.
          example: 0
        message:
          type: string
          description: Human-readable status message (success uses "Successfully")
          example: "Successfully"
        timestamp:
          type: string
          format: date-time
          description: Server time when the response was written
      required:
        - code
        - message
        - timestamp

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          description: Same envelope as success; data is usually omitted
          properties:
            data:
              nullable: true

    LoginType:
      type: string
      description: Login strategy (security.LoginType)
      enum:
        - password
        - sms_code
        - email_code
        - oauth
        - qrcode
        - wx_mini_program
      example: "password"

    HoldRole:
      type: object
      properties:
        role_id:
          type: integer
          format: int64
          example: 2
        role_code:
          type: string
          example: "editor"
        role_level:
          type: integer
          example: 0

    Principal:
      type: object
      description: JWT principal written by AuthRoot (principal.Principal)
      properties:
        user_id:
          type: integer
          format: uint64
          example: 113453443
        username:
          type: string
          example: "johndoe"
        login_id:
          type: string
          example: "johndoe"
        email:
          type: string
          example: "johndoe@example.com"
        status:
          type: integer
          description: Copied from user service status (Activated=0, Disabled=1)
          example: 0
        role:
          $ref: '#/components/schemas/HoldRole'
        permissions:
          type: object
          additionalProperties: true
          nullable: true
        auth_channel:
          type: string
          example: "password"
        extra:
          type: object
          additionalProperties:
            type: string
          nullable: true
      required:
        - user_id
        - login_id
        - status

    TokenPayload:
      type: object
      description: jwt.TokenPayload (expires_in is time.Duration nanoseconds)
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          format: int64
          description: Access token TTL as encoding/json time.Duration (nanoseconds)
      required:
        - access_token
        - refresh_token
        - token_type

    LoginResult:
      type: object
      description: command.LoginResult
      properties:
        user_id:
          type: integer
          format: uint64
        username:
          type: string
        is_new:
          type: boolean
        token:
          $ref: '#/components/schemas/TokenPayload'
      required:
        - user_id
        - token

    RegisterRequest:
      type: object
      description: command.RegisterUserCommand
      properties:
        login_id:
          type: string
          example: "johndoe"
        username:
          type: string
          example: "johndoe"
        password:
          type: string
          format: password
          example: "SecurePass123!"
        email:
          type: string
          example: "xxx@hotmail.com"
      required:
        - login_id
        - password
        - email

    LoginRequest:
      type: object
      description: Bound in auth/http.go Login
      properties:
        login_type:
          $ref: '#/components/schemas/LoginType'
        login_id:
          type: string
          description: Used when login_type=password
        password:
          type: string
          format: password
        account:
          type: string
          description: Phone or email when login_type is sms_code or email_code
        code:
          type: string
          description: OTP or OAuth authorization code
        provider:
          type: string
          description: OAuth provider when login_type=oauth
        ticket:
          type: string
          description: QR ticket when login_type=qrcode
        audience:
          type: string
          description: app = 用户端, console = 管理端; omitted defaults to app
          enum: [app, console]
          example: console
      required:
        - login_type

    RegisterResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              example: "successfully"

    PrincipalResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Principal'

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LoginResult'

    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              example: "successfully"

    RoleInfo:
      type: object
      description: Role assigned to the current user
      properties:
        id:
          type: integer
          format: uint64
          example: 1
        code:
          type: string
          example: "editor"
        name:
          type: string
          example: "内容编辑"
        description:
          type: string
          example: "商品读写+上下架，用户只读"
        status:
          type: integer
          description: 0 = disabled, 1 = active
          enum: [0, 1]
          example: 1
      required:
        - id
        - code
        - name
        - status

    MenuNode:
      type: object
      description: Menu node with merged bitmask permissions
      properties:
        id:
          type: integer
          format: uint64
          example: 3
        parent_id:
          type: integer
          format: uint64
          example: 0
        code:
          type: string
          example: "product"
        name:
          type: string
          example: "商品管理"
        path:
          type: string
          example: "/product"
        icon:
          type: string
          example: "goods"
        sort:
          type: integer
          example: 3
        status:
          type: integer
          description: 0 = hidden, 1 = visible
          enum: [0, 1]
          example: 1
        mask:
          type: integer
          format: uint64
          description: Merged permission bitmask for this menu
          example: 55
        actions:
          type: array
          items:
            type: string
          example: ["READ", "CREATE", "UPDATE", "ENABLE", "CLOSE"]
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuNode'
      required:
        - id
        - code
        - name
        - mask

    CheckPermissionResult:
      type: object
      properties:
        allowed:
          type: boolean
          example: true
        mask:
          type: integer
          format: uint64
          example: 55
        actions:
          type: array
          items:
            type: string
          example: ["READ", "CREATE", "UPDATE"]
      required:
        - allowed
        - mask
        - actions

    AssignUserRoleRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: uint64
          example: 2
        role_id:
          type: integer
          format: uint64
          example: 2
      required:
        - user_id
        - role_id

    RoleMenuRef:
      type: object
      properties:
        role_id:
          type: integer
          format: uint64
        menu_id:
          type: integer
          format: uint64
      required:
        - role_id
        - menu_id

    UpdateRoleMenuMaskRequest:
      type: object
      properties:
        role_id:
          type: integer
          format: uint64
          example: 2
        menu_id:
          type: integer
          format: uint64
          example: 3
        mask:
          type: integer
          format: uint64
          description: Permission bitmask (e.g. 55 = READ|CREATE|UPDATE|ENABLE|CLOSE)
          example: 55
        grant:
          type: boolean
          description: true = OR into existing mask; false = replace mask
          example: false
      required:
        - role_id
        - menu_id
        - mask

    RoleListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RoleInfo'

    MenuTreeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/MenuNode'

    CheckPermissionResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CheckPermissionResult'

    ReplaceUserRolesRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: uint64
        role_ids:
          type: array
          items:
            type: integer
            format: uint64
      required:
        - user_id
        - role_ids

    CreateRoleRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - code
        - name

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name

    StatusRequest:
      type: object
      properties:
        status:
          type: integer
          enum: [0, 1]
      required:
        - status

    RoleMenuGrant:
      type: object
      properties:
        menu_id:
          type: integer
          format: uint64
        code:
          type: string
        name:
          type: string
        mask:
          type: integer
          format: uint64
        actions:
          type: array
          items:
            type: string
      required:
        - menu_id
        - mask

    RoleDetail:
      allOf:
        - $ref: '#/components/schemas/RoleInfo'
        - type: object
          properties:
            menus:
              type: array
              items:
                $ref: '#/components/schemas/RoleMenuGrant'

    CreateMenuRequest:
      type: object
      properties:
        parent_id:
          type: integer
          format: uint64
        code:
          type: string
        name:
          type: string
        path:
          type: string
        icon:
          type: string
        sort:
          type: integer
      required:
        - code
        - name

    UpdateMenuRequest:
      type: object
      properties:
        parent_id:
          type: integer
          format: uint64
        name:
          type: string
        path:
          type: string
        icon:
          type: string
        sort:
          type: integer
      required:
        - name

    ActionDef:
      type: object
      properties:
        id:
          type: integer
          format: uint64
        code:
          type: string
        name:
          type: string
        bit:
          type: integer
        sort:
          type: integer
      required:
        - code
        - bit

    RoleDetailResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RoleDetail'

    RoleMenuListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/RoleMenuGrant'

    ActionListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ActionDef'

    RoleInfoResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RoleInfo'

    MenuNodeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MenuNode'

    RBACMutationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              example: "successfully"

# =============================================================================
# API Paths
# Each path defines the available HTTP methods and their behavior.
# =============================================================================
paths:
  /:
    get:
      summary: Auth root
      description: >
        Authenticates a user with the provided credentials.
        Returns user profile information and a JWT token for subsequent requests.
      operationId: Auth root
      tags:
        - Auth
      responses:
        '200':
          description: Auth root successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
              examples:
                success_response:
                  summary: Current principal
                  value:
                    code: 0
                    message: "Successfully"
                    data:
                      user_id: 113453443
                      username: ""
                      login_id: "johndoe"
                      email: "johndoe@example.com"
                      status: 0
                      role:
                        role_id: 2
                        role_code: "editor"
                        role_level: 0
                      auth_channel: "password"


        # ----- 401 Unauthorized: Invalid credentials -----
        '401':
          description: >
            Unauthorized. Invalid login credentials provided.
            This occurs when the username/password combination is incorrect
            or the account is blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Invalid username or password"

        # ----- 403 Forbidden: Account blocked -----
        '403':
          description: >
            Forbidden. The account is blocked or disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 403
                message: "Account is blocked"

        # ----- 500 Internal Server Error -----
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"
  /register:
    post:
      summary: Register user
      description: >
        Authenticates a user with the provided credentials.
        Returns user profile information and a JWT token for subsequent requests.
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        # ----- 200 OK: register successful -----
        '200':
          description: register successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

  # -------------------------------------------------------------------------
  # Login Endpoint
  # Authenticates a user and returns auth information including JWT token.
  # -------------------------------------------------------------------------
  /login:
    post:
      summary: User login
      description: >
        Authenticates a user with the provided credentials.
        Returns user profile information and a JWT token for subsequent requests.
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              password_login:
                summary: Password login
                value:
                  login_type: "password"
                  login_id: "johndoe"
                  password: "SecurePass123!"
              sms_login:
                summary: SMS code login
                value:
                  login_type: "sms_code"
                  account: "+8613800138000"
                  code: "123456"
      responses:
        # ----- 200 OK: Login successful -----
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success_response:
                  summary: Successful login response
                  value:
                    code: 0
                    message: "Successfully"
                    data:
                      user_id: 113453443
                      username: ""
                      is_new: false
                      token:
                        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        token_type: "Bearer"
                        expires_in: 3600000000000


        # ----- 401 Unauthorized: Invalid credentials -----
        '401':
          description: >
            Unauthorized. Invalid login credentials provided.
            This occurs when the username/password combination is incorrect
            or the account is blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Invalid username or password"

        # ----- 403 Forbidden: Account blocked -----
        '403':
          description: >
            Forbidden. The account is blocked or disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 403
                message: "Account is blocked"

        # ----- 500 Internal Server Error -----
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

  # -------------------------------------------------------------------------
  # Logout Endpoint
  # Invalidates the current session/token.
  # -------------------------------------------------------------------------
  /logout:
    post:
      summary: User logout
      description: >
        Invalidates the current JWT from the Authorization header.
        Request body is ignored.
      operationId: logout
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        # ----- 200 OK: Logout successful -----
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                code: 0
                message: "Successfully"
                data: "successfully"


        # ----- 401 Unauthorized: Missing or invalid token -----
        '401':
          description: Unauthorized. No valid authentication token provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 401
                message: "Authentication token is missing or invalid"

        # ----- 500 Internal Server Error -----
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                message: "Internal server error"

  /rbac/menus:
    get:
      summary: Get current user menu tree
      description: >
        Returns the visible menu tree for the authenticated user.
        Menus without READ bit after multi-role OR merge are omitted.
      operationId: GetUserMenus
      tags:
        - RBAC
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Menu tree retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuTreeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a menu node
      operationId: CreateMenu
      tags:
        - RBAC
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuRequest'
      responses:
        '200':
          description: Menu created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuNodeResponse'
        '400':
          description: Invalid menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rbac/roles:
    get:
      summary: Get current user roles
      description: Returns active roles assigned to the authenticated user.
      operationId: GetUserRoles
      tags:
        - RBAC
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Role list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a role
      operationId: CreateRole
      tags:
        - RBAC
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '200':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleInfoResponse'
        '400':
          description: Invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rbac/check:
    get:
      summary: Check menu permission
      description: >
        Checks whether the authenticated user has the given action bit
        on the specified menu code. Multi-role masks are OR-merged.
      operationId: CheckPermission
      tags:
        - RBAC
      security:
        - BearerAuth: []
      parameters:
        - name: menu
          in: query
          required: true
          schema:
            type: string
          description: Menu code (e.g. product)
          example: product
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [READ, CREATE, UPDATE, DELETE, ENABLE, CLOSE, DISABLE, EXPORT, AUDIT, PUBLISH]
          description: Action bit to check
          example: UPDATE
      responses:
        '200':
          description: Permission check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckPermissionResponse'
        '400':
          description: Invalid menu or action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rbac/users/roles:
    post:
      summary: Assign a role to a user
      description: Binds user_id (user service PK) to an active role.
      operationId: AssignUserRole
      tags:
        - RBAC
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRoleRequest'
      responses:
        '200':
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACMutationResponse'
        '400':
          description: Invalid assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Replace a user's role set
      operationId: ReplaceUserRoles
      tags:
        - RBAC
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserRolesRequest'
      responses:
        '200':
          description: Roles replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACMutationResponse'
        '400':
          description: Invalid replacement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Unassign a role from a user
      operationId: UnassignUserRole
      tags:
        - RBAC
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserRoleRequest'
      responses:
        '200':
          description: Role unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACMutationResponse'
        '400':
          description: Invalid unassignment
          content:
            application/json:
